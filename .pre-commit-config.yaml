# Run the same gates as CI, locally, before each commit:
#   pip install -e ".[dev]" && pre-commit install
#   pre-commit run --all-files     # one-off over the whole tree
#
# The Python tools (ruff/docformatter/mypy) run from your installed dev env
# (language: system) so they always match what CI runs — there's no separate
# pinned tool version to drift. Bump the generic hooks with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^apl/templates\.py$   # trailing whitespace is significant in file templates
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: docformatter
        name: docformatter
        entry: docformatter --in-place
        language: system
        types: [python]
        exclude: ^apl/templates\.py$
      - id: mypy
        name: mypy
        entry: mypy apl/
        language: system
        types: [python]
        pass_filenames: false
