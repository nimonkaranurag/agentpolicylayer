# Installed by `source scripts/dev.sh`; after that these run on every `git commit`.
# To check the whole tree in one go:  pre-commit run --all-files
#
# The Python tools (ruff/docformatter/mypy) run from your installed dev env
# (language: system), so the hook uses whatever version your .venv currently has.
# That avoids maintaining a second, separately-pinned copy of each tool — but it is
# NOT drift-proof: a stale .venv can lag the dependency floors CI fresh-installs, so
# CI, not your local hooks, is the source of truth. Re-run `source scripts/dev.sh` to
# refresh the env, and bump the generic hooks below with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^apl/templates\.py$   # trailing whitespace is significant in file templates
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: docformatter
        name: docformatter
        entry: docformatter --in-place
        language: system
        types: [python]
        exclude: ^apl/templates\.py$
      - id: mypy
        name: mypy
        entry: mypy apl/
        language: system
        types: [python]
        pass_filenames: false
