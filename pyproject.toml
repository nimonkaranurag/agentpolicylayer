[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-layer"
version = "0.3.0"
description = "Agent Policy Layer - Portable, composable policies for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Anurag Ravi Nimonkar" }
]
keywords = [
    "ai",
    "agents",
    "policies",
    "guardrails",
    "llm",
    "safety",
    "mcp",
    "langgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "docformatter>=1.7",
    "types-PyYAML",
]
langgraph = [
    "langgraph>=0.2",
]
all = [
    "agent-policy-layer[dev,langgraph]",
]

[project.urls]
Homepage = "https://github.com/nimonkaranurag/agentpolicylayer"
Repository = "https://github.com/nimonkaranurag/agentpolicylayer"
Issues = "https://github.com/nimonkaranurag/agentpolicylayer/issues"

[project.scripts]
apl = "apl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.docformatter]
recursive = true
pre-summary-newline = true
close-quotes-on-newline = true
wrap-summaries = 88
wrap-descriptions = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Conservative, green-on-current-code set. Bugbear (B) and pyupgrade (UP)
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is owned by black

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                                # intentional re-exports
# The following are pre-existing logic issues deferred to the WP that rewrites
# that code, so the WP-0 formatting gate stays green without touching logic:
"apl/instrumentation/providers/*.py" = ["F401", "E731"] # availability-probe imports + applier lambdas -> WP-6
"apl/instrumentation/state.py" = ["E741"]               # background-loop arg rename -> WP-6
"apl/templates.py" = ["W291", "W293"]                   # whitespace inside literal file templates

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true