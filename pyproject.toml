[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-policy-layer"
dynamic = ["version"]
description = "Agent Policy Layer - Portable, composable policies for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Anurag Ravi Nimonkar" }
]
keywords = [
    "ai",
    "agents",
    "policies",
    "guardrails",
    "llm",
    "safety",
    "mcp",
    "langgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

# Runtime core: the smallest set an embedder doing in-process or stdio policy
# evaluation actually needs. pydantic (domain types), pyyaml (declarative
# policies + serialization), and rich (the injection-safe log renderer in
# apl.logging, used everywhere — not just the CLI). The CLI (`click`) and the HTTP
# transport (`aiohttp`) are genuine subsystems, so they live behind extras rather
# than being forced on every consumer.
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The `apl` command-line tool.
cli = [
    "click>=8.0",
]
# The HTTP policy-server transport and HTTP client transport.
http = [
    "aiohttp>=3.8",
]
langgraph = [
    "langgraph>=0.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "docformatter>=1.7",
    "types-PyYAML",
    "pre-commit>=3.5",
]
# Every runtime feature (CLI + HTTP + LangGraph). CI installs `.[dev,all]`.
all = [
    "agent-policy-layer[cli,http,langgraph]",
]

[project.urls]
Homepage = "https://github.com/nimonkaranurag/agentpolicylayer"
Repository = "https://github.com/nimonkaranurag/agentpolicylayer"
Issues = "https://github.com/nimonkaranurag/agentpolicylayer/issues"

[project.scripts]
# Points at a thin shim outside the apl.cli package: importing any apl.cli
# submodule runs its __init__ (which imports click), so the shim can catch a
# missing `cli` extra and print an install hint instead of a raw ImportError.
apl = "apl._cli_entry:main"

[tool.hatch.version]
# Single source of truth for the package version: apl/__init__.py defines
# `__version__` and hatchling reads it here, so cutting a release is one string
# to bump. (Distinct from PROTOCOL_VERSION in apl/types.py, which versions the
# wire protocol and moves independently of package releases.)
path = "apl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["apl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin the async fixture loop scope explicitly (pytest-asyncio 1.x otherwise warns
# and will change the default); function scope matches how the suite is written.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.docformatter]
recursive = true
pre-summary-newline = true
close-quotes-on-newline = true
make-summary-multi-line = true
wrap-summaries = 88
wrap-descriptions = 88
# templates.py holds triple-quoted *template strings* (not docstrings) and
# test_cli.py embeds triple-quoted YAML/Python policy fixtures; docformatter would
# rewrite both into invalid content, so keep them out of scope.
exclude = ["templates.py", "test_cli.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

# `ruff format` replaces black; `ruff check` (with the `I` rule) replaces isort.
[tool.ruff.lint]
# Conservative, green-on-current-code set. Bugbear (B) and pyupgrade (UP)
# are intentionally not enabled yet.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length is owned by the formatter (ruff format)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                                # intentional re-exports
# The instrumentation code those ignores covered was cleaned up: availability-probe imports
# now use importlib.util.find_spec, the applier lambdas are defs, and the background-loop
# args are renamed — so the F401/E731/E741 ignores for that subtree are gone.
"apl/templates.py" = ["W291", "W293"]                   # whitespace inside literal file templates

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
